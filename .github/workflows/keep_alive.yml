name: Database Keep-Alive (Supabase)

on:
  schedule:
    - cron: "0 0 */15 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Run Auto Chess Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run keep-alive game
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python run_auto_game.py
